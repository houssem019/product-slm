name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Includes validation of the committed splits and labels (schema, alignment, grounding, disjoint splits).
      - name: Tests
        run: uv run pytest -q

      # Replays the recorded zero-shot baseline (no Ollama, no network). Fails on a cassette miss, i.e. when the
      # teacher prompt or docs/LABELING.md changed without re-recording.
      - name: Baseline replay (qwen2.5:7b cassette)
        if: hashFiles('data/cassettes/qwen2.5-7b.json') != ''
        run: uv run python -m pslm.distill.label val --provider fake --model qwen2.5:7b --out replay-preds
