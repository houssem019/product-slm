name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.11 is the local dev version; 3.13 is what Colab ships (the notebook pip-installs this package there).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Includes validation of the committed splits and labels (schema, alignment, grounding, disjoint splits).
      - name: Tests
        run: uv run pytest -q

      # Replays the recorded zero-shot baseline (no Ollama, no network). Fails on a cassette miss, i.e. when the
      # teacher prompt or docs/LABELING.md changed without re-recording.
      - name: Baseline replay (qwen2.5:7b cassette)
        if: hashFiles('data/cassettes/qwen2.5-7b.json') != ''
        run: |
          uv run python -m pslm.distill.label val --provider fake --model qwen2.5:7b --out replay-preds
          uv run python -m pslm.distill.label test --provider fake --model qwen2.5:7b --out replay-preds

      # The fine-tuned SLM's outputs were recorded on a Colab T4 (notebooks/train_colab.ipynb). Replaying them
      # re-grades the GPU model on this CPU runner, and the gate fails if any metric drops below
      # data/eval/baseline.json (e.g. a parser, metric or gold-label change that makes the model look worse).
      - name: Fine-tuned SLM eval gate (replay)
        if: hashFiles('data/cassettes/qwen2.5-1.5b-lora.json') != ''
        run: |
          for split in val test; do
            uv run python -m pslm.distill.label $split --provider fake --model qwen2.5-1.5b-lora --prompt student \
              --gate data/eval/baseline.json --out replay-preds
            uv run python -m pslm.distill.label $split --provider fake --model qwen2.5-1.5b-zeroshot --prompt student \
              --out replay-preds
          done

      - name: Upload replayed predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-preds-py${{ matrix.python-version }}
          path: replay-preds/

  # Builds the CPU image and exercises the real HTTP path inside it (replay backend: the fine-tuned model's
  # recorded outputs, no torch, no GPU). Catches packaging problems the in-process tests can't: missing files in
  # the image, wrong entrypoint, a healthcheck that never goes green.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t product-slm:ci .

      - name: Smoke test (/health, /extract, /metrics)
        run: |
          docker run -d --name slm -p 8000:8000 product-slm:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' slm)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' slm | grep -q healthy || { docker logs slm; exit 1; }
          title=$(head -n 1 data/titles/test.jsonl | python3 -c "import sys, json; print(json.load(sys.stdin)['title'])")
          body=$(python3 -c "import json, sys; print(json.dumps({'titles': [sys.argv[1], 'never recorded title']}))" "$title")
          resp=$(curl -sf -X POST localhost:8000/extract -H 'Content-Type: application/json' -d "$body")
          echo "$resp"
          echo "$resp" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)['results']
          assert r[0]['attributes'] and r[0]['attributes']['category'], r
          assert r[1] == {'title': 'never recorded title', 'attributes': None, 'error': 'not_recorded'}, r
          "
          curl -sf localhost:8000/metrics | python3 -c "import json, sys; m = json.load(sys.stdin); assert m['titles'] == 2, m"
          docker logs slm
