name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.11 is the local dev version; 3.13 is what Colab ships (the notebook pip-installs this package there).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Includes validation of the committed splits and labels (schema, alignment, grounding, disjoint splits).
      - name: Tests
        run: uv run pytest -q

      # Replays the recorded zero-shot baseline (no Ollama, no network). Fails on a cassette miss, i.e. when the
      # teacher prompt or docs/LABELING.md changed without re-recording.
      - name: Baseline replay (qwen2.5:7b cassette)
        if: hashFiles('data/cassettes/qwen2.5-7b.json') != ''
        run: |
          uv run python -m pslm.distill.label val --provider fake --model qwen2.5:7b --out replay-preds
          uv run python -m pslm.distill.label test --provider fake --model qwen2.5:7b --out replay-preds

      # The fine-tuned SLM's outputs were recorded on a Colab T4 (notebooks/train_colab.ipynb). Replaying them
      # re-grades the GPU model on this CPU runner, and the gate fails if any metric drops below
      # data/eval/baseline.json (e.g. a parser, metric or gold-label change that makes the model look worse).
      - name: Fine-tuned SLM eval gate (replay)
        if: hashFiles('data/cassettes/qwen2.5-1.5b-lora.json') != ''
        run: |
          for split in val test; do
            uv run python -m pslm.distill.label $split --provider fake --model qwen2.5-1.5b-lora --prompt student \
              --gate data/eval/baseline.json --out replay-preds
            uv run python -m pslm.distill.label $split --provider fake --model qwen2.5-1.5b-zeroshot --prompt student \
              --out replay-preds
          done

      - name: Upload replayed predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-preds-py${{ matrix.python-version }}
          path: replay-preds/
